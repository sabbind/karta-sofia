name: Обновяване на регистрите

on:
  schedule:
    - cron: "17 2 * * 1,4"      # понеделник и четвъртък, ~05:17 българско време
  workflow_dispatch:
    inputs:
      full:
        description: "Пълно обхождане на регистрите (само при нужда – обновява статусите на старите записи)"
        type: boolean
        default: false
      only:
        description: "Кои регистри"
        type: choice
        options: [всички, само НАГ, само ДНСК, само свързване]
        default: всички

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тестове на разчитането
        run: python tests/test_parse.py

      - name: Режим
        id: mode
        run: |
          FULL=false
          # пълно обхождане само при първото пускане или ако е поискано ръчно
          if [ "${{ github.event.inputs.full }}" = "true" ] || [ ! -f data/nag_rs.jsonl ]; then FULL=true; fi
          if [ "${{ github.event.inputs.only }}" = "само ДНСК" ] && [ ! -f data/dnsk_rp.jsonl ]; then FULL=true; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "Пълно обхождане: $FULL"

      - name: НАГ – разрешения за строеж и удостоверения за въвеждане в експлоатация
        if: ${{ !github.event.inputs.only || github.event.inputs.only == 'всички' || github.event.inputs.only == 'само НАГ' }}
        continue-on-error: true
        timeout-minutes: 245
        run: |
          set -o pipefail
          mkdir -p out
          echo "=== $(date -u '+%F %T') НАГ ===" >> out/run.log
          python -u agent/harvest_nag.py ${{ steps.mode.outputs.full == 'true' && '--full' || '' }} --minutes 220 2>&1 | tee -a out/run.log

      - name: ДНСК – разрешения за ползване
        if: ${{ !github.event.inputs.only || github.event.inputs.only == 'всички' || github.event.inputs.only == 'само ДНСК' }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -o pipefail
          mkdir -p out
          echo "=== $(date -u '+%F %T') ДНСК ===" >> out/run.log
          if [ ! -f data/dnsk_rp.jsonl ] || [ "${{ steps.mode.outputs.full }}" = "true" ]; then ARGS=--all; else ARGS=; fi
          python -u agent/harvest_dnsk.py $ARGS 2>&1 | tee -a out/run.log

      - name: Свързване със сградите и имотите
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          echo "=== $(date -u '+%F %T') Свързване ===" >> out/run.log
          python -u agent/link.py 2>&1 | tee -a out/run.log

      - name: Записване на данните в хранилището
        if: always()
        run: |
          tail -n 3000 out/run.log > out/run.tmp 2>/dev/null && mv out/run.tmp out/run.log || true
          git config user.name "karta-sofia-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A data out site/idx || true
          if git diff --cached --quiet; then echo "Няма промени"; else
            git commit -m "Обновяване на регистрите $(date +%F)"
            # ако междувременно в хранилището има промени (напр. в кода), данните на агента имат предимство
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
          fi

      - name: Публикуване в Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=karta-sofia --branch=main --commit-dirty=true

      - name: Непривързани документи (за изтегляне)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nesvarzani
          path: |
            out/nesvarzani.csv
            out/chakat_kadastar.csv
            out/report.json
            out/run.log
